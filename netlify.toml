[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@aws-sdk/client-s3"]

# Same path as Vercel api/r2-upload — SPA fallback must come after this rule in Netlify UI if you duplicate redirects.
[[redirects]]
  from = "/api/r2-upload"
  to = "/.netlify/functions/r2-upload"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
